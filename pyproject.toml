[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-pushers"
version = "0.2.0"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
]
requires-python = ">=3.9"
authors = [
  { name = "Ben McKeon", email = "mckeon.ben@ul.ie" },
]
description = "A suite of relativistic charged-particle integrators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/mckeon-ben/particle-pushers"

[tool.setuptools.packages.find]
include = ["particle_pushers*"]
